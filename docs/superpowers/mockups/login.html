<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Stick Studio — Đăng nhập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#1b1b1b}a:hover{color:#000000}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.breathe{animation:breathe 3.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.breathe{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #1b1b1b; font-family: 'Be Vietnam Pro', system-ui, sans-serif; padding: 56px 28px 32px; display: flex; flex-direction: column; gap: 28px;">
  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="22" height="34" viewBox="0 0 60 100" aria-hidden="true"><g fill="none" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="16" r="11"></circle><path d="M30 27 L30 62 M30 38 L14 54 M30 38 L46 26 M30 62 L18 92 M30 62 L42 92"></path></g></svg>
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 16px;">stick studio</span>
  </div>

  <div style="height: 220px; background: #fafafa; border-radius: 20px; display: flex; align-items: flex-end; justify-content: center;">
    <svg width="260" height="200" viewBox="0 0 260 200" aria-hidden="true"><g fill="none" stroke="#1b1b1b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="150" y="30" width="70" height="150" rx="4"></rect><circle cx="206" cy="108" r="4"></circle><path d="M20 180 L240 180"></path></g><g class="breathe" fill="none" stroke="#1b1b1b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="80" cy="66" r="14"></circle><path d="M80 80 L80 126 M80 94 L62 116 M80 94 L112 100 M80 126 L68 178 M80 126 L92 178"></path></g><g fill="none" stroke="#ff8c26" stroke-width="4" stroke-linecap="round"><circle cx="120" cy="100" r="7"></circle><path d="M127 100 L144 100 M138 100 L138 107 M143 100 L143 105"></path></g></svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em;">Đăng nhập</h1>
    <p style="margin: 0; color: #555555; font-size: 15px;">Vào xưởng phim người que của bạn.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px;">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500;">Email
      <input type="email" autocomplete="username" value="ban@vidu.vn" style="height: 50px; box-sizing: border-box; border: 1.5px solid #1b1b1b; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 16px; font-weight: 400;">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500;">Mật khẩu
      <input type="password" autocomplete="current-password" value="••••••••••••" style="height: 50px; box-sizing: border-box; border: 1.5px solid #ebebeb; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 16px; font-weight: 400;">
    </label>
    <button type="button" style="height: 54px; margin-top: 6px; border: 0; border-radius: 99px; background: #ff8c26; color: #1b1b1b; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;">Đăng nhập</button>
  </form>

  <p style="margin: 0; margin-top: auto; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #555555;">Truy cập qua Tailscale · HTTPS</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
