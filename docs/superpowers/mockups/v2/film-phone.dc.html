<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Stick Studio — Phim trên điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
:root{--bg:#ffffff;--ink:#1b1b1b;--body:#4a4a4a;--muted:#767676;--line:#ececec;--soft:#f6f6f5;--accent:#ff8c26;--ok:#2f7a4f;--ok-bg:#eaf5ee}
body{margin:0;background:var(--bg)}
.phone{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.back{font-size:15px;color:var(--ink);text-decoration:none}
.next{font-size:14px;color:var(--muted)}
.video{position:relative;margin:0 16px;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#fafafa}
.video svg{display:block;width:100%;height:100%}
.play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(27,27,27,.7);color:#fff;display:grid;place-items:center;font-size:22px}
.info{padding:16px 16px 8px;display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.meta{font-size:13px;color:var(--body);display:flex;gap:12px;align-items:center}
.ok{color:var(--ok)}
.dock{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 16px 20px}
.dock button{height:52px;border-radius:12px;font:inherit;font-size:15px;cursor:pointer}
.p{border:0;background:var(--accent);color:var(--ink);font-weight:600}
.s{border:1.5px solid var(--ink);background:var(--bg);color:var(--ink)}
</style>
</helmet>
<div class="phone">
  <div class="top"><a class="back" href="Main.dc.html">← Phim</a><span class="next">1 / 4 · vuốt để xem phim khác</span></div>
  <div class="video">
    <svg viewBox="0 0 90 140" preserveAspectRatio="xMidYMid slice" aria-label="Video phim"><rect width="90" height="140" fill="#fafafa"></rect><text x="45" y="26" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="6.5" fill="#1b1b1b">Phân số là gì?</text><path d="M0 104 H90" stroke="#1b1b1b" stroke-width="1"></path><g fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g stroke="#1b1b1b"><circle cx="30" cy="62" r="4.5"></circle><path d="M30 66.5 L30 84 M30 72 L23 79 M30 72 L37 68 M30 84 L26 103 M30 84 L34 103"></path></g><g stroke="#d97757"><circle cx="58" cy="62" r="4.5"></circle><path d="M58 66.5 L58 84 M58 72 L66 66 M58 72 L52 79 M58 84 L54 103 M58 84 L62 103"></path></g></g></svg>
    <span class="play" aria-hidden="true">▶</span>
  </div>
  <div class="info">
    <h1>Phân số là gì?</h1>
    <div class="meta"><span class="num">0:26</span><span>3 cảnh</span><span class="ok">✓ Đạt chất lượng</span></div>
  </div>
  <div class="dock">
    <button class="s" type="button">Làm lại</button>
    <button class="s" type="button">Đăng</button>
    <button class="p" type="button">Tải về</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
