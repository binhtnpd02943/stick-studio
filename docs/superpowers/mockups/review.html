<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Stick Studio — Duyệt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#1b1b1b}a:hover{color:#000000}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.breathe{animation:breathe 3.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.breathe{animation:none}}
button:focus-visible,a:focus-visible{outline:3px solid #1b1b1b;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #1b1b1b; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px;">
    <a href="Main.dc.html" aria-label="Về tổng quan" style="width: 44px; height: 44px; border-radius: 99px; background: #f4f4f4; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px;">←</a>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
      <span style="font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{film.title}}</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #555555;">{{position}} · {{film.meta}}</span>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; border-radius: 99px; padding: 2px 9px; {{film.pillStyle}}">{{film.status}}</span>
  </div>

  <div style="flex-grow: 1; margin: 0 16px; background: #fafafa; border: 1px solid #ebebeb; border-radius: 20px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 150px; box-sizing: border-box; overflow: hidden;">
    <svg width="240" height="230" viewBox="0 0 230 230" aria-hidden="true" class="breathe"><g fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="70" cy="44" r="18"></circle><path d="M70 62 L70 132 M70 84 L44 112 M70 84 L104 64 M70 132 L54 200 M70 132 L86 200"></path></g><g fill="none" stroke="#d97757" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="170" cy="50" r="18"></circle><path d="M170 68 L170 138 M170 90 L150 118 M170 90 L190 118 M170 138 L158 200 M170 138 L182 200"></path></g><circle cx="120" cy="56" r="20" fill="#ffffff" stroke="#1b1b1b" stroke-width="3"></circle><path d="M120 36 L120 76" stroke="#1b1b1b" stroke-width="3"></path><path d="M120 36 A20 20 0 0 1 120 76 Z" fill="#ff8c26"></path></svg>
    <p style="position: absolute; left: 18px; right: 18px; bottom: 84px; margin: 0; text-align: center; font-weight: 600; font-size: 18px; line-height: 1.35; background: #ffffff; border-radius: 10px; padding: 8px 10px;">{{film.caption}}</p>
    <div style="position: absolute; left: 18px; right: 18px; bottom: 28px; display: flex; align-items: center; gap: 10px;">
      <button type="button" aria-label="Tạm dừng" style="width: 44px; height: 44px; border-radius: 99px; border: 0; background: #1b1b1b; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2 L5.5 2 L5.5 12 L3 12 Z M8.5 2 L11 2 L11 12 L8.5 12 Z" fill="#ffffff"></path></svg></button>
      <span style="flex-grow: 1; height: 6px; background: #e2e2e2; border-radius: 99px; display: block; overflow: hidden;"><span style="display: block; width: 62%; height: 6px; background: #1b1b1b;"></span></span>
    </div>
    <sc-if value="{{film.warning}}" hint-placeholder-val="{{ false }}">
      <p style="position: absolute; top: 14px; left: 14px; right: 14px; margin: 0; background: #1b1b1b; color: #ffffff; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.4;">{{film.warning}}</p>
    </sc-if>
  </div>

  <div style="padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 12px;">
    <sc-if value="{{showReasons}}" hint-placeholder-val="{{ false }}">
      <div role="group" aria-label="Lý do làm lại" style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
          <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="min-height: 44px; padding: 0 14px; border-radius: 99px; font: inherit; font-size: 14px; cursor: pointer; {{r.style}}">{{r.label}}</button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
      <p role="status" style="margin: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; background: #f4f4f4; border-radius: 99px; padding: 8px 12px;">{{toast}}</p>
    </sc-if>
    <div style="display: flex; gap: 10px;">
      <button type="button" onClick="{{redo}}" style="flex: 1 1 0; height: 60px; border-radius: 99px; border: 1.5px solid #1b1b1b; background: #ffffff; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;">{{redoLabel}}</button>
      <button type="button" onClick="{{approve}}" style="flex: 1.3 1 0; height: 60px; border-radius: 99px; border: 0; background: #ff8c26; color: #1b1b1b; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;">{{approveLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { index: 0, showReasons: false, reason: null, toast: null };
  }
  films() {
    return [
      { title: 'Phân số là gì?', meta: '0:26 · v2', status: 'chờ duyệt', pillStyle: 'background:#ff8c26;', caption: 'Một nửa cái bánh, ta viết là 1/2', warning: null },
      { title: 'Vì sao trời mưa?', meta: '0:31 · v1', status: 'QA lỗi', pillStyle: 'background:#1b1b1b;color:#ffffff;', caption: 'Hơi nước bay lên, gặp lạnh thành mây', warning: 'QA: Minh đứng yên 3,1 giây ở cảnh 2. Chỉ làm lại được, chưa duyệt được.' }
    ];
  }
  next(msg) {
    const n = this.films().length;
    this.setState({ index: (this.state.index + 1) % n, showReasons: false, reason: null, toast: msg });
  }
  renderVals() {
    const list = this.films();
    const film = list[this.state.index];
    const labels = ['Sai kiến thức', 'Cảnh khó hiểu', 'Giọng', 'Nhịp', 'Khác'];
    const reasons = labels.map((label) => {
      const on = this.state.reason === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        style: on ? 'border:0;background:#1b1b1b;color:#ffffff;' : 'border:1.5px solid #ebebeb;background:#ffffff;color:#1b1b1b;',
        pick: () => this.setState({ reason: label })
      };
    });
    const qaFailed = !!film.warning;
    return {
      film,
      position: (this.state.index + 1) + '/' + list.length,
      reasons,
      showReasons: this.state.showReasons,
      toast: this.state.toast,
      redoLabel: this.state.showReasons ? (this.state.reason ? 'Gửi làm lại' : 'Chọn lý do') : 'Làm lại',
      approveLabel: qaFailed ? 'Bỏ qua →' : 'Duyệt',
      redo: () => {
        if (!this.state.showReasons) return this.setState({ showReasons: true, toast: null });
        if (this.state.reason) this.next('Đã gửi làm lại · ' + this.state.reason);
      },
      approve: () => this.next(qaFailed ? 'Đã bỏ qua' : 'Đã duyệt ✓ · phim tiếp')
    };
  }
}
</script>
</body>
</html>
